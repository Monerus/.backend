version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: alembic
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: